# config.yml

# Local development backend (comment out for production)
local_backend: true

backend:
  name: proxy
  proxy_url: http://localhost:8081/api/v1

media_folder: 'public/assets/uploads'
public_folder: '/assets/uploads'
collections:
    - name: 'blog'
      label: 'Blog Posts'
      label_singular: 'Blog Post'
      folder: 'content/posts/'
      create: true
      slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
      summary: '{{title}} - {{date}}'
      sortable_fields: ['date', 'title', 'author']
      editor:
        preview: false
      fields:
        - label: 'Layout'
          name: 'layout' 
          widget: 'hidden'
          default: 'post'
        - label: 'Title'
          name: 'title'
          widget: 'string'
          hint: 'SEO-friendly title (60 chars max recommended)'
        - label: 'Excerpt'
          name: 'excerpt'
          widget: 'text'
          required: false
          hint: 'Short description for preview cards (160 chars max)'
        - label: 'Publish Date'
          name: 'date'
          widget: 'datetime'
          date_format: 'YYYY-MM-DD'
          time_format: 'HH:mm'
        - label: 'Featured Post'
          name: 'featured'
          widget: 'boolean'
          default: false
          required: false
          hint: 'Show on homepage'
        - label: 'Draft'
          name: 'draft'
          widget: 'boolean'
          default: false
          required: false
          hint: 'Save as draft (not published)'
        - label: 'Categories'
          name: 'categories'
          multiple: true
          widget: "relation"
          collection: "blogoptions"
          file: "categories"
          search_fields: ["categories.*.title"]
          display_fields: ["categories.*.title"]
          value_field: "categories.*.title"
          required: false
        - label: 'Tags'
          name: 'tags'
          multiple: true
          widget: "relation"
          collection: "blogoptions"
          file: "tags"
          search_fields: ["tags.*.title"]
          display_fields: ["tags.*.title"]
          value_field: "tags.*.title"
          required: false
        - label: 'Author'
          name: 'author'
          widget: 'relation'
          collection: 'author'
          display_fields: [display_name]
          search_fields: [display_name]
          value_field: 'name'
        - label: 'Featured Image'
          name: 'image'
          widget: 'image'
          hint: 'Recommended size: 1200x630px for social sharing'
        - label: 'Image Alt Text'
          name: 'image_alt'
          widget: 'string'
          required: false
          hint: 'Describe the image for accessibility'
        - label: 'Body'
          name: 'body'
          widget: 'markdown'
          
    - name: 'blogoptions'
      label: 'Blog Options'
      delete: false # Prevent users from deleting documents in this collection
      editor:
        preview: false
      files:
        - name: 'categories'
          label: 'Categories'
          file: 'content/data/categories.yml'
          description: 'List of categories'
          fields:
            - name: 'categories'
              label: 'Categories'
              label_singular: 'Category'
              widget: list
              fields:
                - { label: 'Title', name: 'title', widget: 'string', hint: 'Enter title' }
                - { label: 'Description', name: 'description', widget: 'markdown' }
        - name: 'tags'
          label: 'Tags'
          file: 'content/data/tags.yml'
          description: 'List of tags'
          fields:
            - name: 'tags'
              label: 'Tags'
              label_singular: 'Tag'
              widget: list
              fields:
                - { label: 'Title', name: 'title', widget: 'string', hint: 'Enter title' }
                - { label: 'Description', name: 'description', widget: 'markdown' } 
      
    - name: 'author'
      label: 'Authors'
      label_singular: 'Author'
      folder: 'content/authors/'
      create: true
      slug: '{{slug}}'
      identifier_field: 'display_name'
      summary: '{{display_name}} - {{position}}'
      editor:
        preview: false
      fields:
        - { label: 'Layout', name: 'layout', widget: 'hidden', default: 'author' }
        - { label: 'Short Name', name: 'name', widget: 'string', hint: 'Username/slug (e.g., john-doe)' }
        - { label: 'Display Name', name: 'display_name', widget: 'string', hint: 'Full name to display' }
        - { label: 'Position', name: 'position', widget: 'string', hint: 'Job title' }
        - { label: 'Email', name: 'email', widget: 'string', required: false }
        - { label: 'Avatar', name: 'avatar', widget: 'image', required: false, hint: 'Profile photo (300x300px recommended)' }
        - { label: 'Bio', name: 'body', widget: 'markdown', hint: 'Author biography' }
        - label: "Social Links"
          name: "social"
          widget: "object"
          collapsed: true
          fields: 
            - {label: "Website", name: "website", widget: "string", required: false}
            - {label: "LinkedIn", name: "linkedin", widget: "string", required: false, hint: 'Full URL'}
            - {label: "Twitter/X", name: "twitter", widget: "string", required: false, hint: 'Full URL or @username'}
            - {label: "GitHub", name: "github", widget: "string", required: false, hint: 'Full URL'}
            - {label: "Facebook", name: "facebook", widget: "string", required: false}
            - {label: "Instagram", name: "instagram", widget: "string", required: false}
    - name: 'testimonial'
      label: 'Testimonials'
      folder: 'content/testimonials/'
      create: true
      slug: '{{year}}-{{month}}-{{day}}-{{name}}'
      editor:
        preview: false
      fields:
        - label: 'Layout'
          name: 'layout'
          widget: 'hidden'
          default: 'testimonial'
        - label: 'Full Name'
          name: 'name'
          widget: 'string'
        - label: 'Position'
          name: 'position'
          widget: 'string'
        - label: 'Country'
          name: 'country'
          widget: 'string'
        - label: 'Testimonial'
          name: 'body'
          widget: 'markdown'
  
    - name: 'portfolio'
      label: 'Portfolio'
      folder: 'content/portfolio/'
      create: true
      slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
      editor:
        preview: false
      fields:
        - label: 'Layout'
          name: 'layout'
          widget: 'hidden'
          default: 'portfolio'
        - label: 'Title'
          name: 'title'
          widget: 'string'
        - label: 'Description'
          name: 'description'
          widget: 'string'
        - label: 'Projet URL'
          name: 'project_url'
          widget: 'string'
        - label: 'completed on'
          name: 'completed_on'
          widget: 'date'
        - label: 'Publish Date'
          name: 'date'
          widget: 'datetime'
        - label: 'Body'
          name: 'body'
          widget: 'markdown'
        - label: 'Featured Image'
          name: 'image'
          widget: 'image'
          allow_multiple: true
        - label: 'Video'
          name: 'video'
          widget: 'string'
          required: false
        - label: 'Categories'
          name: 'categories'
          multiple: true
          widget: "relation"
          collection: "portfoliooptions"
          file: "portcategories"
          search_fields: ["categories.*.title"]
          display_fields: ["categories.*.title"]
          value_field: "categories.*.title"
        - label: 'Technologies'
          name: 'technologies'
          multiple: true
          widget: "relation"
          collection: "portfoliooptions"
          file: "technologies"
          search_fields: ["technologies.*.title"]
          display_fields: ["technologies.*.title"]
          value_field: "technologies.*.title"
        - label: "Gallery"
          name: "galleryImages"
          widget: "list"
          summary: '{{fields.image}}'
          field: {label: Image, name: image, widget: image}
        - label: 'Android App'
          name: 'android'
          widget: 'string'
          required: false
        - label: 'iOS App'
          name: 'ios'
          widget: 'string'
          required: false
          
    - name: 'portfoliooptions'
      label: 'Portfolio Options'
      delete: false # Prevent users from deleting documents in this collection
      editor:
        preview: false
      files:
        - name: 'technologies'
          label: 'Technologies'
          file: 'content/data/technologies.yml'
          description: 'List of Technologies'
          fields:
            - name: 'technologies'
              label: 'Technologies'
              label_singular: 'Technologi'
              widget: list
              fields:
                - { label: 'Title', name: 'title', widget: 'string', hint: 'Enter title' }
                - { label: 'Description', name: 'description', widget: 'markdown' }
        - name: 'portcategories'
          label: 'Portfolio categories'
          file: 'content/data/portcategories.yml'
          description: 'List of Portfolio categories'
          fields:
            - name: 'categories'
              label: 'Portfolio categories'
              label_singular: 'Category'
              widget: list
              fields:
                - { label: 'Title', name: 'title', widget: 'string', hint: 'Enter title' }
                - { label: 'Description', name: 'description', widget: 'markdown' }